name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The order store is a hand-rolled open-addressing table with
  # backward-shift deletion — exactly the code class sanitizers exist
  # for. Every test runs under ASan+UBSan.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (ASan+UBSan)
        run: >
          cmake -B build-san -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-san -j
      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  # libFuzzer smoke run over both untrusted-input walkers (scan_buffer +
  # decode_stream). CI is the only place this builds: Apple clang has no
  # libFuzzer runtime. Seed corpus is generated by fuzz/make_corpus.py
  # and committed under fuzz/corpus/.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (libFuzzer)
        run: >
          cmake -B build-fuzz -DFULLDEPTH_FUZZ=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build-fuzz --target decode_fuzz -j
      - name: Fuzz (60s)
        run: ./build-fuzz/decode_fuzz fuzz/corpus -max_total_time=60
